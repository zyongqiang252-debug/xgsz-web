<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">通用服务器整机方案示意</title>
  <desc id="desc">三台银黑色企业级机架式服务器，适用于通用计算、存储和虚拟化场景。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafb"/>
      <stop offset=".55" stop-color="#e9f1f3"/>
      <stop offset="1" stop-color="#dce8eb"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#657984"/>
      <stop offset=".16" stop-color="#334852"/>
      <stop offset=".55" stop-color="#162a33"/>
      <stop offset="1" stop-color="#405661"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4c4ca"/>
      <stop offset="1" stop-color="#6e838d"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#263d48"/>
      <stop offset="1" stop-color="#13252d"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0v46" fill="none" stroke="#7ca1aa" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
    <pattern id="vents" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#0d1f28"/>
      <rect y="2" width="5" height="2" rx="1" fill="#4f6872"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="190%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#grid)"/>
  <path d="M0 585 1200 460M0 650 1200 525" stroke="#8baeb6" stroke-opacity=".18"/>
  <circle cx="1025" cy="135" r="170" fill="none" stroke="#007f79" stroke-opacity=".1"/>
  <circle cx="1025" cy="135" r="125" fill="none" stroke="#007f79" stroke-opacity=".08"/>
  <ellipse cx="610" cy="618" rx="425" ry="58" fill="#19313a" opacity=".24" filter="url(#shadow)"/>
  <g transform="translate(165 135)">
    <g id="general-unit">
      <polygon points="82,48 760,48 872,6 194,6" fill="url(#top)" stroke="#b8c8cd" stroke-width="2"/>
      <polygon points="760,48 872,6 872,104 760,146" fill="url(#side)" stroke="#54707b" stroke-width="2"/>
      <rect x="82" y="48" width="678" height="98" rx="5" fill="url(#metal)" stroke="#8ca0a8" stroke-width="2"/>
      <rect x="104" y="67" width="220" height="60" rx="3" fill="url(#vents)" stroke="#697e87"/>
      <rect x="340" y="67" width="210" height="60" rx="3" fill="#12252e" stroke="#586f79"/>
      <g fill="#435a65" stroke="#91a4ab" stroke-width="1">
        <rect x="353" y="77" width="42" height="40" rx="2"/>
        <rect x="404" y="77" width="42" height="40" rx="2"/>
        <rect x="455" y="77" width="42" height="40" rx="2"/>
        <rect x="506" y="77" width="33" height="40" rx="2"/>
      </g>
      <g fill="#087f78">
        <circle cx="666" cy="79" r="5"/>
        <circle cx="685" cy="79" r="5" fill="#4bb9ae"/>
      </g>
      <path d="M606 91h45M606 107h45" stroke="#8ba0a9" stroke-width="3" stroke-linecap="round" opacity=".65"/>
      <rect x="90" y="54" width="662" height="4" fill="#d2dde1" opacity=".5"/>
    </g>
    <use href="#general-unit" y="132"/>
    <use href="#general-unit" y="264"/>
  </g>
  <g transform="translate(972 452)" fill="none" stroke="#007f79" stroke-opacity=".22">
    <rect width="132" height="132" rx="3"/>
    <rect x="17" y="17" width="98" height="98" rx="3"/>
    <path d="M0 66h132M66 0v132"/>
  </g>
</svg>
