<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">国产算力服务器整机方案示意</title>
  <desc id="desc">银灰色国产算力服务器与国产加速卡组合示意，突出自主算力与生态适配。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fb"/>
      <stop offset=".55" stop-color="#e9eff5"/>
      <stop offset="1" stop-color="#dce7ef"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8b96"/>
      <stop offset=".2" stop-color="#3e5360"/>
      <stop offset=".58" stop-color="#1d333e"/>
      <stop offset="1" stop-color="#4e6470"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7d2d9"/>
      <stop offset="1" stop-color="#81939e"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a424e"/>
      <stop offset="1" stop-color="#142731"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23505d"/>
      <stop offset="1" stop-color="#102b36"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0v46" fill="none" stroke="#7e9eae" stroke-opacity=".15" stroke-width="1"/>
    </pattern>
    <pattern id="vents" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#0d2029"/>
      <rect y="2" width="5" height="2" rx="1" fill="#5b7380"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="190%">
      <feGaussianBlur stdDeviation="21"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#grid)"/>
  <path d="M0 590 1200 455M0 655 1200 520" stroke="#7999aa" stroke-opacity=".2"/>
  <g fill="none" stroke="#356f91" stroke-opacity=".13">
    <circle cx="1015" cy="130" r="170"/>
    <rect x="904" y="19" width="222" height="222" rx="8" transform="rotate(18 1015 130)"/>
    <path d="M1015 0v260M885 130h260"/>
  </g>
  <ellipse cx="595" cy="617" rx="430" ry="55" fill="#1c3442" opacity=".27" filter="url(#shadow)"/>
  <g transform="translate(145 158)">
    <g id="domestic-unit">
      <polygon points="78,50 762,50 877,4 193,4" fill="url(#top)" stroke="#b8c5cd" stroke-width="2"/>
      <polygon points="762,50 877,4 877,106 762,152" fill="url(#side)" stroke="#526a77" stroke-width="2"/>
      <rect x="78" y="50" width="684" height="102" rx="5" fill="url(#metal)" stroke="#91a2ac" stroke-width="2"/>
      <rect x="100" y="70" width="206" height="62" rx="3" fill="url(#vents)" stroke="#697f8b"/>
      <rect x="324" y="70" width="238" height="62" rx="3" fill="#132a35" stroke="#617887"/>
      <g fill="#395563" stroke="#8ba0ac">
        <rect x="339" y="80" width="45" height="42" rx="2"/>
        <rect x="393" y="80" width="45" height="42" rx="2"/>
        <rect x="447" y="80" width="45" height="42" rx="2"/>
        <rect x="501" y="80" width="45" height="42" rx="2"/>
      </g>
      <g fill="#438fc2">
        <circle cx="682" cy="84" r="6"/>
        <circle cx="702" cy="84" r="6" fill="#83c5e8"/>
        <circle cx="722" cy="84" r="6"/>
      </g>
      <path d="M610 100h65M610 118h52" stroke="#8fa5b0" stroke-width="3" stroke-linecap="round" opacity=".75"/>
    </g>
    <use href="#domestic-unit" y="137"/>
  </g>
  <g transform="translate(821 438) rotate(7)">
    <ellipse cx="132" cy="166" rx="152" ry="24" fill="#233d4a" opacity=".2"/>
    <rect width="252" height="152" rx="9" fill="url(#card)" stroke="#82a6b4" stroke-width="2"/>
    <rect x="21" y="20" width="148" height="111" rx="5" fill="#0c222c" stroke="#5e8999"/>
    <rect x="47" y="43" width="94" height="66" rx="5" fill="#123541" stroke="#5ca2bd" stroke-width="2"/>
    <path d="M62 59h64v34H62zM71 59V47m12 12V47m12 12V47m12 12V47M71 93v12m12-12v12m12-12v12m12-12v12" fill="none" stroke="#6dc6df" stroke-width="4"/>
    <g fill="#5fb8d3">
      <circle cx="199" cy="36" r="7"/>
      <circle cx="221" cy="36" r="7" fill="#98d9eb"/>
    </g>
    <path d="M184 66h44M184 86h34M184 106h44" stroke="#7098a6" stroke-width="5" stroke-linecap="round"/>
