server:
  address: ${XGSZ_BIND:127.0.0.1}
  port: ${XGSZ_PORT:8080}
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: xgsz-website
  datasource:
    url: ${XGSZ_DATABASE_URL}
    username: ${XGSZ_DATABASE_USER:xgsz_website}
    password: ${XGSZ_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    log-resolved-exception: false
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.cows.handler
logging:
  level:
    root: WARN
    com.cows.website: INFO
